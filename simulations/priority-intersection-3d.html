<body>

        DRAG: orbit &nbsp; SCROLL: zoom &nbsp; RIGHT-DRAG: pan

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";


        // ── SETUP ────────────────────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 1000,
            HEIGHT = 900;

        // ── PALETTE (BLUEPRINT / CAD SCHEMATIC) ───────────────────────────────────────
        const BG_COLOR = [9, 17, 28];
        const ASPHALT = [14, 26, 42];
        const LANE_YEL = [90, 220, 255];   // main-road centerline: cyan
        const LANE_WHT = [200, 225, 235];  // cross-road centerline: pale cyan-white
        const BLUEPRINT_LINE = [80, 200, 235];
        const GRID_LINE = [40, 80, 100];
        const SPEC_ZONE = [190, 195, 200]; // light grey spectator-zone fill

        // ── TRACK OFFSET ──────────────────────────────────────────────────────────
        const TRACK_OFFSET_Y = 80;

        // ── TRACK SEGMENTS (8 segments forming a rectangle with a crossover) ──
        const segments = [
            [
                [100, 400 + TRACK_OFFSET_Y],
                [500, 400 + TRACK_OFFSET_Y]
            ],
            [
                [500, 400 + TRACK_OFFSET_Y],
                [900, 400 + TRACK_OFFSET_Y]
            ],
            [
                [900, 400 + TRACK_OFFSET_Y],
                [900, 100 + TRACK_OFFSET_Y]
            ],
            [
                [900, 100 + TRACK_OFFSET_Y],
                [500, 100 + TRACK_OFFSET_Y]
            ],
            [
                [500, 100 + TRACK_OFFSET_Y],
                [500, 400 + TRACK_OFFSET_Y]
            ],
            [
                [500, 400 + TRACK_OFFSET_Y],
                [500, 700 + TRACK_OFFSET_Y]
            ],
            [
                [500, 700 + TRACK_OFFSET_Y],
                [100, 700 + TRACK_OFFSET_Y]
            ],
            [
                [100, 700 + TRACK_OFFSET_Y],
                [100, 400 + TRACK_OFFSET_Y]
            ],
        ];
        const TRACK_W = 80;
        const HALF_W = TRACK_W / 2;
        const IX = 500,
            IY = 400 + TRACK_OFFSET_Y;

        // ── RACE PARAMETERS ──────────────────────────────────────────────────────
        const LAP_KM = 2.8;                 // track length: 1 canvas unit == 1 metre (2800 units total)
        const TOTAL_LAPS = 20;              // 20 x 2.8km = 56.0km (nearest whole-lap match to 55km target)
        const RACE_KM = LAP_KM * TOTAL_LAPS;
        let raceStarted = false;
        let startTimer = 0;
        const START_DELAY = 120;
        const GREEN_LIGHT = 180;

        // ── INTERSECTION TUNING (improved) ──────────────────────────────────────
        const BRAKE_START = 0.45;        // start yielding earlier
        const YIELD_P = 0.82;            // commit point
        const BLOCK_ON = 80;             // increased to start slowing earlier
        const BLOCK_OFF = 160;           // increased to hold block longer
        const COLLISION_R = 60;          // hard-stop threshold: actual physical distance
                                          // between the two cars' real (rendered) positions,
                                          // not just approach distance along the main road.
                                          // Sized with real stopping distance in mind (a fast
                                          // EV2 needs several ticks to actually shed speed).
        const DECEL_ALPHA = 0.115;       // smoother decel (+15% braking strength)
        const ACCEL_ALPHA = 0.08;

        // ── CAR DATA ──────────────────────────────────────────────────────────────
        const CAR_DATA = [
            { id: 201, color: [255, 60, 60], type: "Tesla M3 Perf", speed_range: [1.317, 1.488], cls: "EV2" },
            { id: 202, color: [255, 140, 0], type: "Hyundai IONIQ 5N", speed_range: [1.317, 1.488], cls: "EV2" },
            { id: 203, color: [80, 255, 120], type: "BMW i4 M50", speed_range: [1.292, 1.462], cls: "EV2" },
            { id: 204, color: [0, 220, 255], type: "BYD Seal AWD", speed_range: [1.275, 1.445], cls: "EV2" },
            { id: 301, color: [220, 220, 220], type: "Nissan Leaf e+", speed_range: [1.105, 1.258], cls: "EV3" },
            { id: 302, color: [255, 220, 60], type: "MG4 XPower", speed_range: [1.105, 1.258], cls: "EV3" },
            { id: 303, color: [120, 180, 255], type: "VW ID.3 GTX", speed_range: [1.088, 1.241], cls: "EV3" },
            { id: 304, color: [180, 255, 180], type: "Megane E-Tech", speed_range: [1.088, 1.241], cls: "EV3" },
            { id: 401, color: [255, 120, 180], type: "Honda e", speed_range: [0.807, 0.952], cls: "EV4" },
            { id: 402, color: [120, 255, 255], type: "Nissan Sakura", speed_range: [0.807, 0.952], cls: "EV4" },
            { id: 403, color: [255, 255, 255], type: "Mini Electric", speed_range: [0.807, 0.952], cls: "EV4" },
            { id: 404, color: [180, 180, 180], type: "Fiat 500e", speed_range: [0.807, 0.952], cls: "EV4" },
        ];

        // ── BEZIER CORNER HELPERS ──────────────────────────────────────────────────
        const CORNER_R = 26;

        function segUv(idx) {
            const [
                [x1, y1],
                [x2, y2]
            ] = segments[idx];
            const d = Math.hypot(x2 - x1, y2 - y1);
            return [(x2 - x1) / d, (y2 - y1) / d];
        }

        function segLen(idx) {
            const [
                [x1, y1],
                [x2, y2]
            ] = segments[idx];
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function bz2(p0, p1, p2, t) {
            const u = 1 - t;
            return [
                u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
                u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]
            ];
        }

        function bz2Ang(p0, p1, p2, t) {
            const u = 1 - t;
            const tx = 2 * u * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
            const ty = 2 * u * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
            return Math.atan2(ty, tx);
        }

        function smoothDraw(si, progress) {
            const [
                [x1, y1],
                [x2, y2]
            ] = segments[si];
            const dx = x2 - x1,
                dy = y2 - y1;
            const L = Math.hypot(dx, dy);
            if (L < 1) return [x1, y1, 0.0];

            const ux = dx / L,
                uy = dy / L;
            const de = L * (1 - progress);
            const ds = L * progress;

            if (de < CORNER_R && L > CORNER_R * 2.2) {
                const nxt = (si + 1) % 8;
                if (segLen(nxt) > CORNER_R * 2.2) {
                    const [nux, nuy] = segUv(nxt);
                    const jx = x2,
                        jy = y2;
                    const P0 = [jx - CORNER_R * ux, jy - CORNER_R * uy];
                    const P1 = [jx, jy];
                    const P2 = [jx + CORNER_R * nux, jy + CORNER_R * nuy];
                    const t = 0.5 * (1 - de / CORNER_R);
                    const [bx, by] = bz2(P0, P1, P2, t);
                    return [bx, by, bz2Ang(P0, P1, P2, Math.max(t, 1e-4))];
                }
            }

            if (ds < CORNER_R && L > CORNER_R * 2.2) {
                const prv = (si - 1 + 8) % 8;
                if (segLen(prv) > CORNER_R * 2.2) {
                    const [pux, puy] = segUv(prv);
                    const jx = x1,
                        jy = y1;
                    const P0 = [jx - CORNER_R * pux, jy - CORNER_R * puy];
                    const P1 = [jx, jy];
                    const P2 = [jx + CORNER_R * ux, jy + CORNER_R * uy];
                    const t = 0.5 + 0.5 * ds / CORNER_R;
                    const [bx, by] = bz2(P0, P1, P2, t);
                    return [bx, by, bz2Ang(P0, P1, P2, Math.min(t, 1 - 1e-4))];
                }
            }

            return [x1 + dx * progress, y1 + dy * progress, Math.atan2(dy, dx)];
        }

        // ── PARTICLES ──────────────────────────────────────────────────────────────────
        class Particle {
            constructor(x, y, color, lifeMult = 1) {
                this.x = x + (Math.random() * 4 - 2);
                this.y = y + (Math.random() * 4 - 2);
                this.vx = (Math.random() - 0.5) * 2.5;
                this.vy = (Math.random() - 0.5) * 2.5;
                this.life = this.max_life = Math.floor(Math.random() * 13 + 6) * lifeMult;
                this.color = color;
                this.size = Math.floor(Math.random() * 3) + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.94;
                this.vy *= 0.94;
                this.life--;
            }
            draw(ctx) {
                const a = this.life / this.max_life;
                const [r, g, b] = this.color;
                ctx.fillStyle =
                    `rgba(${Math.min(255, r*a+15)}, ${Math.min(255, g*a+15)}, ${Math.min(255, b*a+15)}, ${a})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(1, this.size * a), 0, Math.PI * 2);
                ctx.fill();
            }
        }
        const particles = [];

        // ── CAR CLASS ──────────────────────────────────────────────────────────────
        class Car {
            constructor(car_id, color, car_type, speed_range, cls) {
                this.id = car_id;
                this.color = color;
                this.type = car_type;
                this.cls = cls;
                this.base_speed = speed_range[0] + Math.random() * (speed_range[1] - speed_range[0]);
                this.speed = 0;
                this.segment = 4;
                this.progress = 0;
                this.offset = 0;
                this.targetOffset = 0;
                this.laps = 0;
                this.state = "normal";
                this._blocked = false;
                this._committed = false;
                this.vis_angle = Math.PI / 2;
                this._exhaust_t = 0;
                this._isOvertaking = false;
                this._overtakeTimer = 0;

                // ── AGGRESSIVE / BUMP BEHAVIOR (reduced chance) ──
                this.isAggressive = false;
                this._aggressiveChecked = false;
                this._aggressiveCooldown = 0;
                this.bumpTimer = 0;
                this.bumpOffset = 0;
                this._bumpParticlesSpawned = false;
                // High-water mark of progress reached on the CURRENT pass
                // through segment 4. Used (instead of a simple committed
                // flag, which could be set then aborted a tick later) to
                // decide whether this car has genuinely been deep in/through
                // the box at some point -- only then is it safe to exempt it
                // from the stop-line clamp below.
                this._maxProgressThisPass = 0;
            }

            nearestHoriz(cars) {
                let best = Infinity;
                for (let o of cars) {
                    if (o === this || (o.segment !== 0 && o.segment !== 1)) continue;
                    const [[sx], [ex]] = segments[o.segment];
                    const ox = sx + (ex - sx) * o.progress;
                    const d = Math.abs(ox - IX);
                    if (d < best) best = d;
                }
                return best;
            }

            // Real physical distance to the nearest MAIN-ROAD car, using each
            // car's actual rendered position (including lane offset from
            // overtaking) rather than an approach-distance proxy. This is the
            // late, close-range safety net that catches cases the early
            // approach-distance check can miss.
            renderPos() {
                const [dx, dy, da] = smoothDraw(this.segment, this.progress);
                const perp = da + Math.PI / 2;
                let off = this.offset;
                if (this.bumpTimer > 0) off = this.bumpOffset + (this.offset - this.bumpOffset) * 0.05;
                return [dx + Math.cos(perp) * off, dy + Math.sin(perp) * off];
            }

            nearestPhysicalHazard(cars) {
                let best = Infinity;
                const [mx, my] = this.renderPos();
                for (let o of cars) {
                    if (o === this || (o.segment !== 0 && o.segment !== 1)) continue;
                    const [ox, oy] = o.renderPos();
                    const d = Math.hypot(mx - ox, my - oy);
                    if (d < best) best = d;
                }
                return best;
            }

            canChangeLane(cars, targetOffset) {
                const safeDist = 0.05;
                const safeLateral = 20;
                for (let o of cars) {
                    if (o === this) continue;
                    if (o.segment !== this.segment) continue;
                    let diff = (o.progress - this.progress + 1) % 1;
                    if (diff < safeDist && diff > 0) {
                        if (Math.abs(o.offset - targetOffset) < safeLateral) return false;
                    }
                    let diff2 = (this.progress - o.progress + 1) % 1;
                    if (diff2 < safeDist && diff2 > 0) {
                        if (Math.abs(o.offset - targetOffset) < safeLateral) return false;
                    }
                }
                return true;
            }

            spawnBumpParticles(x, y) {
                const colors = [
                    this.color,
                    [255, 200, 50],
                    [255, 100, 50],
